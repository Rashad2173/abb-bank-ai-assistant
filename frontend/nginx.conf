# The UI and the services on one origin: the browser never needs CORS.
#
# A template: at start-up the nginx image fills in ${ACCESS_CODE} from the environment.
# Empty (the default) leaves the app open; set, every visitor needs the code first —
# for a public demo, where the API spends the project's OpenAI budget.

# /api/<service>/… → the service's port.
map $api_service $api_port {
    chat      8001;
    analytics 8002;
    ingestion 8003;
    scraper   8005;
}

# Access: no code configured, or the visitor's cookie holds it.
map "${ACCESS_CODE}" $access_required {
    ""      0;
    default 1;
}
map $cookie_abb_access $code_matches {
    "${ACCESS_CODE}" 1;
    default          0;
}
map "$access_required$code_matches" $access_ok {
    "0" 1;
    "00" 1;
    "01" 1;
    "11" 1;
    default 0;
}
map "$access_ok$uri" $api_denied {
    ~^0/api/ 1;
    default  0;
}

# Questions per visitor: 20 a minute, short bursts of 10 more.
limit_req_zone $binary_remote_addr zone=questions:10m rate=20r/m;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;   # uploads: the site data (~21 MB) and PDFs

    # Compress the app and the API's JSON (the scraped pages of a link job are ~21 MB of JSON).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    proxy_read_timeout 300s;    # answers and uploads can take a while
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;

    # Behind a tunnel or proxy on this machine, the visitor's address comes in X-Forwarded-For.
    set_real_ip_from 127.0.0.1;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header X-Forwarded-For;
    real_ip_recursive on;

    # Docker's DNS, asked again every 10 s: a restarted service gets a new address, and
    # an address resolved once at start-up would answer 502 until nginx restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Errors in the services' JSON format, so the UI can say what happened.
    default_type application/json;
    if ($api_denied) {
        return 401 '{"error": {"code": "unauthorized", "message": "access code required"}, "request_id": "$request_id"}';
    }
    error_page 429 = @rate_limited;
    location @rate_limited {
        return 429 '{"error": {"code": "rate_limited", "message": "too many questions"}, "request_id": "$request_id"}';
    }

    location ~ ^/api/chat/(?<chat_path>v1/chat.*)$ {
        limit_req zone=questions burst=10 nodelay;
        limit_req_status 429;
        proxy_pass http://chat:8001/$chat_path$is_args$args;
    }

    location ~ ^/api/(?<api_service>chat|analytics|ingestion|scraper)/(?<api_path>.*)$ {
        proxy_pass http://$api_service:$api_port/$api_path$is_args$args;
    }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /access.html {
        add_header Cache-Control "no-store";
    }

    # Single-page app: unknown paths serve the app — or the access page, without the code.
    location / {
        if ($access_ok = 0) {
            rewrite ^ /access.html last;
        }
        try_files $uri $uri/ /index.html;
    }
}
