# The UI and the services on one origin: the browser never needs CORS.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 64m;   # uploads: the site data (~21 MB) and PDFs

    # Compress the app and the API's JSON (the scraped pages of a link job are ~21 MB of JSON).
    gzip on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;
    proxy_read_timeout 300s;    # answers and uploads can take a while
    proxy_set_header Host $host;
    proxy_set_header X-Request-ID $request_id;

    location /api/chat/      { proxy_pass http://chat:8001/; }
    location /api/analytics/ { proxy_pass http://analytics:8002/; }
    location /api/ingestion/ { proxy_pass http://ingestion:8003/; }
    location /api/scraper/   { proxy_pass http://scraper:8005/; }

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Single-page app: unknown paths serve the app.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
