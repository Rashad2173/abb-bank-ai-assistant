# ABB Bank AI Assistant — the whole application.
#
#   docker compose up -d --build          # → http://localhost:8080   (Attu, the Milvus UI: :8000)
#   docker compose -f docker-compose.yml -f docker-compose.cpu.yml up -d --build   # machine without a GPU
#
# Put OPENAI_API_KEY into .env first (see .env.example). On the first start the
# inference service downloads its two models (~4.5 GB) into the `models` volume.
# The search index starts empty: open the UI and learn the site from its link
# (or upload abb_pages.jsonl) — the chat opens once the data is processed.
#
# Milvus services follow the official standalone compose file of Milvus v3.0.2;
# data lives in named volumes instead of bind-mounted folders.

x-milvus-image: &milvus-image milvusdb/milvus:v3.0.2

services:
  # One-shot: gives the Milvus data volume to the container's milvus user.
  milvus-volume-init:
    image: *milvus-image
    user: "0:0"
    network_mode: none
    read_only: true
    restart: "no"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -eu
        uid="$$(id -u milvus)"
        gid="$$(id -g milvus)"
        marker="/var/lib/milvus/.milvus-volume-owner-$${uid}-$${gid}"
        if [ ! -e "$${marker}" ]; then
          chown -R "$${uid}:$${gid}" /var/lib/milvus
          touch "$${marker}"
          chown "$${uid}:$${gid}" "$${marker}"
        fi
    volumes:
      - milvus-data:/var/lib/milvus

  etcd:
    image: quay.io/coreos/etcd:v3.5.25
    restart: unless-stopped
    environment:
      - ETCD_AUTO_COMPACTION_MODE=revision
      - ETCD_AUTO_COMPACTION_RETENTION=1000
      - ETCD_QUOTA_BACKEND_BYTES=4294967296
      - ETCD_SNAPSHOT_COUNT=50000
    volumes:
      - etcd-data:/etcd
    command: etcd -advertise-client-urls=http://etcd:2379 -listen-client-urls http://0.0.0.0:2379 --data-dir /etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 30s
      timeout: 20s
      retries: 3

  minio:
    image: milvusdb/minio:RELEASE.2024-12-18T13-15-44Z
    restart: unless-stopped
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    command: minio server /minio_data --console-address ":9001"
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3

  milvus:
    image: *milvus-image
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      MINIO_REGION: us-east-1
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
    volumes:
      - milvus-data:/var/lib/milvus
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      start_period: 90s
      timeout: 20s
      retries: 3
    ports:
      - "19530:19530"
      - "9091:9091"
    depends_on:
      milvus-volume-init:
        condition: service_completed_successfully
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  attu:
    image: zilliz/attu:v3.0.1
    restart: unless-stopped
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "8000:3000"
    depends_on:
      milvus:
        condition: service_healthy

  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: abb
      POSTGRES_PASSWORD: abb
      POSTGRES_DB: abb_analytics
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5433:5432"  # 5432 is often taken by a local PostgreSQL
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U abb -d abb_analytics"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ------------------------------------------------------------------ #
  # Application services (services/Dockerfile, one target each)
  # ------------------------------------------------------------------ #
  inference:
    build: { context: ., dockerfile: services/Dockerfile, target: inference }
    restart: unless-stopped
    environment:
      INFERENCE_DEVICE: auto
    volumes:
      - models:/models
    ports:
      - "8004:8004"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

  chat:
    build: { context: ., dockerfile: services/Dockerfile, target: chat }
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      MILVUS_URI: http://milvus:19530
      INFERENCE_URL: http://inference:8004
      ANALYTICS_URL: http://analytics:8002
    ports:
      - "8001:8001"
    depends_on:
      milvus: { condition: service_healthy }
      analytics: { condition: service_healthy }

  analytics:
    build: { context: ., dockerfile: services/Dockerfile, target: analytics }
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql+psycopg://abb:abb@postgres:5432/abb_analytics
    ports:
      - "8002:8002"
    depends_on:
      postgres: { condition: service_healthy }

  ingestion:
    build: { context: ., dockerfile: services/Dockerfile, target: ingestion }
    restart: unless-stopped
    environment:
      MILVUS_URI: http://milvus:19530
      INFERENCE_URL: http://inference:8004
    volumes:
      - models:/models
    ports:
      - "8003:8003"
    depends_on:
      milvus: { condition: service_healthy }

  scraper:
    build: { context: ., dockerfile: services/Dockerfile, target: scraper }
    restart: unless-stopped
    environment:
      INGESTION_URL: http://ingestion:8003
    volumes:
      # Page cache + output. SCRAPER_DATA=./data reuses a local cache (no 30-minute first crawl).
      - ${SCRAPER_DATA:-scraper-data}:/data
    ports:
      - "8005:8005"
    depends_on:
      ingestion: { condition: service_healthy }

  frontend:
    build: { context: frontend }
    restart: unless-stopped
    environment:
      # Set in .env for a public demo: visitors need the code first. Empty: open.
      ACCESS_CODE: ${ACCESS_CODE:-}
    ports:
      - "8080:80"
    depends_on:
      - chat
      - analytics
      - ingestion
      - scraper

volumes:
  models:
  scraper-data:
  postgres-data:
  milvus-data:
  etcd-data:
  minio-data:
